name: Capturas para la tienda

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    name: Capturas 1920x1080 con canales de ejemplo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Armar versión de prueba
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleAmazonDebug

      - name: Herramientas para la lista de ejemplo
        run: pip install --quiet pillow

      - name: Activar aceleración
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capturas con el control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/tienda/capturas.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tienda
          path: tienda/

      - name: Guardar las capturas en la rama "tienda"
        if: always()
        run: |
          cd tienda
          git init -q
          git checkout -q -b tienda
          git add -A
          git -c user.name="FitoTV" -c user.email="fitotv@users.noreply.github.com" commit -q -m "Capturas ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tienda
