name: Publicar la versión sin candado (Hostinger)

# Arma la web para tu dominio (http://) y la deja lista en la rama "hostinger".
# Hostinger la jala de ahí con su despliegue por Git; no hacen falta contraseñas en GitHub.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/hostinger.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  build:
    name: Armar y dejar en la rama hostinger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar
        working-directory: web
        run: npm ci
      - name: Armar
        working-directory: web
        env:
          FITOTV_BASE: /
          VITE_PROXY: proxy.php
          FITOTV_VERSION: 1.0.${{ github.run_number }}
        run: npm run build
      - name: Agregar el lector de listas y las reglas del sitio
        run: cp -r web/hostinger/. web/dist/
      - name: Subir a la rama hostinger
        working-directory: web/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b hostinger
          git config user.name "FitoTV"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Versión sin candado ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" hostinger
