name: Publicar la web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".github/tienda/demo.py"
  # Cada lunes se vuelve a publicar para que la guía de la lista de ejemplo siga al día.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Armar la web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar
        working-directory: web
        run: npm ci
      - name: Armar
        working-directory: web
        env:
          FITOTV_VERSION: 1.0.${{ github.run_number }}
        run: npm run build
      - name: Lista de ejemplo (para quien revisa en las tiendas)
        env:
          DEMO_HORAS: "200"
        run: |
          pip install --quiet pillow
          python3 .github/tienda/demo.py web/dist/demo https://adolfomendozam.github.io/fitotv/demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
