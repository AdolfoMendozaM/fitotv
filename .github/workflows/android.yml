name: Armar FitoTV

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "web/**"
      - ".github/workflows/web.yml"
      - ".github/workflows/hostinger.yml"
      - ".github/workflows/tienda.yml"
      - ".github/workflows/emulador.yml"
      - ".github/tienda/**"
      - ".github/scripts/**"
      - "roku/**"
      - ".github/workflows/roku.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fitotv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: App para tele (Google TV y Fire TV)
    runs-on: ubuntu-latest
    env:
      FITOTV_VERSION_CODE: ${{ github.run_number }}
      FITOTV_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Probar el lector de listas
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testGithubDebugUnitTest

      - name: Revisar que esté la llave de firma
        if: github.event_name != 'pull_request'
        env:
          HAY_LLAVE: ${{ secrets.FITOTV_KEYSTORE_B64 != '' && secrets.FITOTV_KEYSTORE_PASSWORD != '' && secrets.FITOTV_KEY_ALIAS != '' && secrets.FITOTV_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAY_LLAVE" != "true" ]; then
            echo "::error::Falta la llave de firma. Agrega FITOTV_KEYSTORE_B64, FITOTV_KEYSTORE_PASSWORD, FITOTV_KEY_ALIAS y FITOTV_KEY_PASSWORD en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Armar el instalable
        env:
          FITOTV_KEYSTORE_B64: ${{ secrets.FITOTV_KEYSTORE_B64 }}
          FITOTV_KEYSTORE_PASSWORD: ${{ secrets.FITOTV_KEYSTORE_PASSWORD }}
          FITOTV_KEY_ALIAS: ${{ secrets.FITOTV_KEY_ALIAS }}
          FITOTV_KEY_PASSWORD: ${{ secrets.FITOTV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleGithubRelease :app:assembleAmazonRelease

      - name: Ponerle nombre
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "FitoTV-${FITOTV_VERSION_NAME}.apk"
          # Copia con nombre fijo: así el enlace "latest/download/FitoTV.apk" siempre baja la más nueva.
          cp app/build/outputs/apk/github/release/app-github-release.apk FitoTV.apk
          # Versión para subir a la tienda de Amazon (se actualiza por la tienda).
          cp app/build/outputs/apk/amazon/release/app-amazon-release.apk FitoTV-amazon.apk
          # La app lee este archivo para saber si hay versión nueva (Ajustes → Actualizar FitoTV).
          python3 - <<'PY'
          import json, os
          notas = open('app/novedades.txt', encoding='utf-8').read().strip() if os.path.exists('app/novedades.txt') else ''
          json.dump({
              'versionCode': int(os.environ['FITOTV_VERSION_CODE']),
              'versionName': os.environ['FITOTV_VERSION_NAME'],
              'notes': notas,
          }, open('version.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: FitoTV-${{ env.FITOTV_VERSION_NAME }}
          path: |
            FitoTV-*.apk
            FitoTV.apk

      - name: Publicar la versión
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FITOTV_VERSION_NAME }}
          name: FitoTV ${{ env.FITOTV_VERSION_NAME }}
          files: |
            FitoTV-${{ env.FITOTV_VERSION_NAME }}.apk
            FitoTV.apk
            FitoTV-amazon.apk
            version.json
          body: |
            FitoTV.apk: instalable para Google TV, Android TV y Fire TV (Downloader).
            FitoTV-amazon.apk: la misma app para subir a la tienda de Amazon.
            Se instala encima de la versión anterior sin borrar perfiles ni listas.
            Desde esta versión, FitoTV avisa cuando hay una nueva y se actualiza desde Ajustes.
