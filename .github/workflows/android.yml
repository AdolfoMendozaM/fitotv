name: Armar FitoTV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fitotv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: App para tele (Google TV y Fire TV)
    runs-on: ubuntu-latest
    env:
      FITOTV_VERSION_CODE: ${{ github.run_number }}
      FITOTV_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Probar el lector de listas
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Armar el instalable
        env:
          FITOTV_KEYSTORE_B64: ${{ secrets.FITOTV_KEYSTORE_B64 }}
          FITOTV_KEYSTORE_PASSWORD: ${{ secrets.FITOTV_KEYSTORE_PASSWORD }}
          FITOTV_KEY_ALIAS: ${{ secrets.FITOTV_KEY_ALIAS }}
          FITOTV_KEY_PASSWORD: ${{ secrets.FITOTV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Ponerle nombre
        run: |
          cp app/build/outputs/apk/release/app-release.apk "FitoTV-${FITOTV_VERSION_NAME}.apk"
          # Copia con nombre fijo: así el enlace "latest/download/FitoTV.apk" siempre baja la más nueva.
          cp app/build/outputs/apk/release/app-release.apk FitoTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitoTV-${{ env.FITOTV_VERSION_NAME }}
          path: FitoTV-*.apk

      - name: Publicar la versión
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FITOTV_VERSION_NAME }}
          name: FitoTV ${{ env.FITOTV_VERSION_NAME }}
          files: |
            FitoTV-*.apk
            FitoTV.apk
          body: |
            Instalable para Google TV, Android TV y Fire TV.
            Se instala encima de la versión anterior sin borrar perfiles ni listas.
