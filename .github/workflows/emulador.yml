name: Probar en emulador de tele

on:
  workflow_dispatch:
  push:
    branches: [prueba-*]

permissions:
  contents: write

jobs:
  smoke:
    name: Recorrido en Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Armar versión de prueba
        run: |
          chmod +x gradlew
          mkdir -p recorrido
          set -o pipefail
          ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:assembleGithubDebug 2>&1 | tee recorrido/armado.txt

      - name: Videos de prueba de sonido
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/sonido && cd /tmp/sonido
          v="-f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 90 -map 0:v -map 1:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 50"
          ffmpeg -hide_banner -loglevel error $v -c:a aac -b:a 128k -f mpegts aac.ts
          ffmpeg -hide_banner -loglevel error $v -c:a ac3 -b:a 192k -f mpegts ac3.ts
          ffmpeg -hide_banner -loglevel error $v -c:a eac3 -b:a 192k -f mpegts eac3.ts
          ffmpeg -hide_banner -loglevel error $v -c:a mp2 -b:a 192k -f mpegts mp2.ts
          ffmpeg -hide_banner -loglevel error $v -c:a dca -strict -2 -f mpegts dts.ts || rm -f dts.ts
          ls -la

      - name: Activar aceleración
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Recorrido con el control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/recorrido.sh && bash .github/scripts/sonido.sh && bash .github/scripts/lista-grande.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorrido
          path: recorrido/

      - name: Guardar las capturas en la rama "recorrido"
        if: always()
        run: |
          mkdir -p recorrido
          mkdir -p recorrido/pruebas && cp app/build/test-results/*/*/*.xml recorrido/pruebas/ 2>/dev/null || true
          cd recorrido
          mogrify -resize 1280x720 *.png 2>/dev/null || true
          git init -q
          git checkout -q -b recorrido
          git add -A
          git -c user.name="FitoTV" -c user.email="fitotv@users.noreply.github.com" commit -q -m "Recorrido ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" recorrido
