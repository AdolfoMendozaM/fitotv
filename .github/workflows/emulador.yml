name: Probar en emulador de tele

on:
  workflow_dispatch:
  push:
    branches: [prueba-*]

permissions:
  contents: write

jobs:
  smoke:
    name: Recorrido en Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Armar versión de prueba
        run: |
          chmod +x gradlew
          mkdir -p recorrido
          set -o pipefail
          ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:assembleGithubDebug 2>&1 | tee recorrido/armado.txt

      - name: Videos de prueba de sonido
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/sonido && cd /tmp/sonido
          v="-f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 90 -map 0:v -map 1:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 50"
          ffmpeg -hide_banner -loglevel error $v -c:a aac -b:a 128k -f mpegts aac.ts
          ffmpeg -hide_banner -loglevel error $v -c:a ac3 -b:a 192k -f mpegts ac3.ts
          ffmpeg -hide_banner -loglevel error $v -c:a eac3 -b:a 192k -f mpegts eac3.ts
          ffmpeg -hide_banner -loglevel error $v -c:a mp2 -b:a 192k -f mpegts mp2.ts
          # Película de prueba con dos idiomas y dos subtítulos (fuera de la carpeta de canales de sonido).
          mkdir -p /tmp/pistas && cd /tmp/pistas
          printf '1\n00:00:01,000 --> 00:00:45,000\nHola, este es el subtítulo en español\n\n2\n00:00:45,500 --> 00:01:30,000\nSegunda parte en español\n' > es.srt
          printf '1\n00:00:01,000 --> 00:00:45,000\nHello, this is the English subtitle\n\n2\n00:00:45,500 --> 00:01:30,000\nSecond part in English\n' > en.srt
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -f lavfi -i sine=frequency=660:sample_rate=48000 -i es.srt -i en.srt -t 90 -map 0:v -map 1:a -map 2:a -map 3 -map 4 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 50 -c:a aac -b:a 96k -c:s srt -metadata:s:a:0 language=spa -metadata:s:a:1 language=eng -metadata:s:s:0 language=spa -metadata:s:s:1 language=eng pista.mkv
          cp /tmp/sonido/aac.ts /tmp/pistas/aac.ts
          ls -la /tmp/sonido /tmp/pistas

      - name: Activar aceleración
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Recorrido con el control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: if [ "${GITHUB_REF_NAME#prueba-audio}" != "$GITHUB_REF_NAME" ]; then bash .github/scripts/sonido.sh; elif [ "${GITHUB_REF_NAME#prueba-funciones}" != "$GITHUB_REF_NAME" ]; then bash .github/scripts/funciones.sh; else bash .github/scripts/recorrido.sh && bash .github/scripts/sonido.sh && bash .github/scripts/funciones.sh && bash .github/scripts/lista-grande.sh; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorrido
          path: recorrido/

      - name: Guardar las capturas en la rama "recorrido"
        if: always()
        run: |
          mkdir -p recorrido
          mkdir -p recorrido/pruebas && cp app/build/test-results/*/*/*.xml recorrido/pruebas/ 2>/dev/null || true
          cd recorrido
          mogrify -resize 1280x720 *.png 2>/dev/null || true
          git init -q
          git checkout -q -b recorrido
          git add -A
          git -c user.name="FitoTV" -c user.email="fitotv@users.noreply.github.com" commit -q -m "Recorrido ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" recorrido
