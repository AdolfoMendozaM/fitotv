name: Probar en emulador de tele

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    name: Recorrido en Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Armar versión de prueba
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Activar aceleración
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Recorrido con el control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/recorrido.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorrido
          path: recorrido/

      - name: Guardar las capturas en la rama "recorrido"
        if: always()
        run: |
          cd recorrido
          mogrify -resize 1280x720 *.png || true
          git init -q
          git checkout -q -b recorrido
          git add -A
          git -c user.name="FitoTV" -c user.email="fitotv@users.noreply.github.com" commit -q -m "Recorrido ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" recorrido
